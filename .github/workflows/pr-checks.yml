# Reusable PR quality gate for omnidotdev repos.
#
# Enforces that the PR title is Extended Conventional Commits (ECC). Repos are
# squash-only (allowMergeCommit/allowRebaseMerge both false), so the PR title
# becomes the permanent commit subject on master, which is why the title is
# gated here rather than per-commit. Changesets are advisory (the changeset
# bot comments on every PR), not gated here.
#
# Status check context (from the caller's `checks` job): checks / pr-title
name: PR Checks ✅

on:
  workflow_call:

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Mirrors the ECC type-enum from the styleguide. ECC accepts both the full
      # word and its short alias for every aliased type, so list both (e.g.
      # "feature" and "feat", "documentation" and "docs", "performance" and
      # "perf"); either form passes.
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            documentation
            feat
            feature
            fix
            perf
            performance
            refactor
            revert
            style
            test
          requireScope: false
          # Reject a leading-uppercase subject (config-conventional subject-case).
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" must start lowercase (Extended Conventional Commits).
